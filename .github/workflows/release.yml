name: Release

on:
  workflow_dispatch:
    inputs:
      publish_minor:
        description: Publish the next minor release from the highest published version.
        required: false
        type: boolean
        default: false
      publish_patch:
        description: Publish the next patch release from the highest published version.
        required: false
        type: boolean
        default: false
      version:
        description: Publish an exact semantic version, for example v1.2.3.
        required: false
        type: string
        default: ""

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  goreleaser:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # GoReleaser creates the release and uploads its assets.
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PUBLISH_MINOR: ${{ inputs.publish_minor }}
          INPUT_PUBLISH_PATCH: ${{ inputs.publish_patch }}
          INPUT_VERSION: ${{ inputs.version }}
        run: ./.github/scripts/resolve-release-version.sh
      - name: Create local release tag
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: git tag "$RELEASE_VERSION"
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Syft
        id: install-syft
        uses: anchore/sbom-action/download-syft@v0.24.3
      - name: Add Syft to PATH
        env:
          SYFT_COMMAND: ${{ steps.install-syft.outputs.cmd }}
        run: dirname "$SYFT_COMMAND" >> "$GITHUB_PATH"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
