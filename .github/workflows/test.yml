name: Test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  verify-actions-lock:
    name: Verify action lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0
      - name: Verify locked dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
          - "macos-14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Just
        uses: extractions/setup-just@v4.0.0
      - name: Run tests
        run: |
          mkdir -p "${RUNNER_TEMP}/gocoverdir"
          GOCOVERDIR="${RUNNER_TEMP}/gocoverdir" just cov
        env:
          BINE_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          files: coverage.txt
          flags: go-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          files: junit.xml
          flags: go-${{ matrix.os }}
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
  mod:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check mod tidy
        run: go mod tidy -diff
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Just
        uses: extractions/setup-just@v4.0.0
      - name: Check linters
        run: just lint --fix=0
