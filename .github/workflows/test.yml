name: Test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify-actions-lock:
    name: Verify action lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0
      - name: Verify locked dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  lint-workflows:
    name: Lint GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check workflows and Dependabot configuration
        uses: jdx/jactionlint@v2.2.0
        with:
          strict-exit: "true"

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
          - "macos-15"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Run tests
        run: |
          mkdir -p "${RUNNER_TEMP}/gocoverdir"
          GOCOVERDIR="${RUNNER_TEMP}/gocoverdir" just cov
        env:
          BINE_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          files: coverage.txt
          flags: go-${{ matrix.os }}
          # Coverage uploads retain the existing repository token; no deployment environment is needed.
          # jactionlint ignore=secrets-outside-env
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          files: junit.xml
          flags: go-${{ matrix.os }}
          report_type: test_results
          # Test-result uploads use the same repository token as coverage.
          # jactionlint ignore=secrets-outside-env
          token: ${{ secrets.CODECOV_TOKEN }}
  mod:
    name: Check Go module files
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check mod tidy
        run: go mod tidy -diff
  lint:
    name: Lint Go
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Check linters
        run: just lint --fix=0
